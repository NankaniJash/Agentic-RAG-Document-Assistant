services:
  - type: web
    name: synapse
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBED_PROVIDER
        value: hf
      - key: HF_EMBED_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBED_DIM
        value: 384
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
